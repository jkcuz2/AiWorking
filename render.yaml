services:
  - type: web
    name: ai-game-studio-coordinator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MCP_ACCESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
